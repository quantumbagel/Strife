[about]
title = "### {logo} Strife"
description = "Strife is an interactive, thread-based gaming platform built for Discord. The goal of this project is to create a seamless gaming experience within Discord, without having to resort to the limited Activities feature or third-party websites."
developer = "-# This project is developed by [@quantumbagel](https://github.com/quantumbagel)."
browse_catalog_btn = "Browse Catalog"
background_btn = "Background"
github_btn = "GitHub Repository"
bg_title = "### {logo} Strife {forward} Background"
bg_description = "Some background on how this project came about:\n* Originally, this started when my friend made a Discord bot that could play Liar's Dice. ([LoRiggio](https://github.com/Pixelz22/LoRiggioDev))\n* This gave me grand visions of a discord bot for arbitrary board games.\n* However, I kinda suck at programming. Many of the core features (leaderboards, ELO, matchmaking, etc.) were half-baked.\n* This ended up creating a lot of tech debt and a half-functional project. (see that here: [PlayCord](https://github.com/PlayCord/bot))\n* After roughly a year of working on PlayCord on and off, I decided to lock in.\n* The result of that is Strife, a much better implementation of the same concept.\n\nTotal development time for this project: 2024-2026, over 750 hours of work.\nIf you like what I've done here, I'm always looking for new opportunities :D"
attributions_btn = "Attributions"
attributions_title = "### {logo} Strife {forward} Attributions"
attributions = "Strife is built using the following open-source libraries:\n\n* **[discord.py](https://github.com/Rapptz/discord.py)** - Modern, easy to use, feature-rich, and async ready API wrapper for Discord. (MIT)\n* **[asyncpg](https://github.com/MagicStack/asyncpg)** - A fast PostgreSQL database client library for Python. (Apache 2.0)\n* **[Pydantic](https://github.com/pydantic/pydantic)** - Data validation and settings management using Python type hints. (MIT)\n* **[msgpack](https://github.com/msgpack/msgpack-python)** - MessagePack serializer implementation for Python. (Apache 2.0)\n* **[PyYAML](https://github.com/yaml/pyyaml)** - A full-featured YAML framework for Python. (MIT)"
other_attributions = "Other attributions:\n\n* **[icons8](https://icons8.com)** - Most of the custom emojis used in this project are from icons8. (Free for personal use)\n * **[LoRiggio](https://github.com/Pixelz22/LoRiggioDev)** - The original Liar's Dice bot that inspired this project. (N/A)\n * **[PlayCord](https://github.com/PlayCord/bot)** - The original attempt I made at this this project. (MIT)\n * **[USSYorktown10](https://discordapp.com/users/659823188049657858)** - This dumb profile picture :)"
back_btn = "Back"

