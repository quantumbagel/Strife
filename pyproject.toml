[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strife"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
  "discord.py>=2.6",
  "asyncpg>=0.30",
  "msgpack>=1.1",
  "PyYAML>=6.0",
  "pydantic>=2",
  "pydantic-settings>=2",
  "packaging>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
strife = "strife.__main__:main"

[tool.setuptools.packages.find]
include = ["strife*"]

[tool.setuptools.package-data]
"*" = ["plugin.toml", "changelog.toml", "emoji/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
