services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: strife
      POSTGRES_PASSWORD: strife
      POSTGRES_DB: strife
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strife -d strife"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      # Host port for tools like psql. Change POSTGRES_HOST_PORT if a host Postgres uses 5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

  bot:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      STRIFE_DATABASE_URL: postgresql://strife:strife@db:5432/strife
    volumes:
      - ./strife:/app/strife
      - ./config:/app/config
      - ./plugins:/app/plugins
      # Keep schema, emoji and changelogs in step with the mounted code after a git pull.
      - ./migrations:/app/migrations
      - ./assets:/app/assets
      - ./changelog:/app/changelog
    restart: unless-stopped
    init: true
    # Shutdown waits up to ~30s (offers 5 + lobbies 5 + games 15 + offers 5), then closes the pool.
    stop_grace_period: 45s

volumes:
  pgdata:
