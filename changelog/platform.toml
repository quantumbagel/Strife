# Game API history. Shown in /strife about → Changes.
# Bump when GameContext or types games import change.

[[release]]
version = "3.1.0"
date = "2026-10-04"
summary = "Form specs for bots, turn-based advance, stricter bot and event rows."
added = [
  "FormSpec and BotRequest.form_fields — legal values plus cardinality; the host merges a bot's omitted form defaults like a human submit",
  "TurnBasedGame.advance() and is_active(seat); on_timeout and on_forfeit default to advance()",
  "check_timeout_consequence accepts several seats' resolved sources; AUTO_PASS is valid if any one includes pass",
]
changed = [
  "BotRequest.sources is the resolved set (frozenset, possibly empty), never \"any\"",
  "Bots must return kind GAME moves and never system sources; a crash or invalid move is a system timeout for that turn",
  "record_event args must be JSON-serializable (TypeError otherwise)",
  "A game without play() is skipped; a replay whose log ends before the match does is unavailable",
  "timeout_strike is a host system row; a non-removed forfeit can be a pending seat's answer",
]
fixed = [
  "until=any windows accept only one winner; inputs are logged when accepted",
  "Turn-deadline clocks survive restart catch-up and do not reset on re-asks even after expiry",
]

[[release]]
version = "3.0.0"
date = "2026-10-04"
summary = "Live matches survive restarts; forms, turn deadlines, typed results."
added = [
  "ctx.turn_deadline(seconds=None) — one clock across several request_input / request_inputs calls, so re-asking after an invalid submit does not reset it",
  "Select(..., form=True) form fields: not moves, not logged; the pick rides on the seat's next move as args[source]. BotRequest.form lists the legal values",
  "SeatPrompt and request_inputs(per_seat=...) for per-seat sources and descriptions",
  "Result enum (WIN / LOSS / DRAW) for GameOutcome.results, and Move.interrupt (Interrupt.FORFEIT / TIMEOUT)",
  "TurnBasedGame.on_timeout(move), called by take_turn on a timeout instead of apply_move",
]
changed = [
  "Live matches are stored as they run and resume after a restart by re-running play() against the log; a plugin removed or updated mid-match abandons it at the next boot",
  "Seat events (bot takeovers, mid-match removals) are applied by the engine at their log position; the engine calls remove_player exactly once and games must not call it",
  "Games get their own copies of Player; Player.mention is the plain display name until the host installs mention markup",
  "AUTO_PASS timeouts require \"pass\" in the allowed sources; otherwise the host injects a system timeout",
  "plugin.toml platform_version is required",
  "Log format 3: matches from before platform 3.0 cannot be replayed",
]
removed = [
  "per_seat_sources and descriptions on request_inputs — use per_seat",
  "Registry.discover(package) — plugins load only through plugin.toml",
  "Settings formatting helpers from strife.engine.metadata (moved to the host); strife.engine.roles and strife.engine.errors (moved out of the game API)",
]

[[release]]
version = "2.0.0"
date = "2026-10-04"
summary = "Replays re-run play(); bots get the request; one input core."
added = [
  "Game.render_replay(ctx, live_view) — defaults to the live board; override to reveal hidden information. Game.replay_label() for frame labels",
  "BotRequest (seat, difficulty, allowed sources, description); bot_move(request) replaces bot_move(difficulty, seat)",
  "TimeoutConsequence enum, ctx.turn_timeout_seconds, and self.bot_rng for bot decisions",
  "strife.engine.testing.MockContext — drive a game from a script with real bots and the same log as live",
]
changed = [
  "Replays re-run play() against the stored log, so self.rng is for rules only; bots and the host never draw from it",
  "Every input is logged; record_event rows are checkpoints, and a replay that disagrees with them is unavailable instead of wrong",
  "The host rejects bot moves outside the request's allowed sources",
  "supports_player_removal is inferred from overriding remove_player",
  "run_cpu docs: it is a thread pool, so pure Python still holds the GIL",
]
removed = [
  "Game.parse_replay, ReplayBuilder, iter_replay, ReplayStep, is_terminal_replay_move, and GameMetadata.supports_replay — every game is replayable",
  "The record parameter of request_input / request_inputs",
  "ctx.rng, ctx.players, ctx.settings — use self.rng, self.players, self.settings / self.setting()",
  "MoveRecord and Move.arguments; TurnBasedGame.reset, render_final, render_final_replay, replay_initial_status, replay_action_status; Player.display, timeout_strikes, taken_over",
]

[[release]]
version = "1.0.2"
date = "2026-10-04"
summary = "Blameless first-to-act timeouts, logged removals."
changed = [
  "until=any windows that time out return {} with no AFK consequence; treat it as nobody acted",
  "Mid-match removals always log a system forfeit row with removed=true; replays continue past it",
]

[[release]]
version = "1.0.1"
date = "2026-10-03"
summary = "Faction-aware match end on forfeit."
added = [
  "Game.forfeit_end_outcome() — override when the host ends the match on a forfeit",
]
changed = [
  "forfeit_outcome() can force an end and distinguish timeout vs forfeit",
  "until=any waits for a delayed bot move when humans are also acting",
]

[[release]]
version = "1.0.0"
date = "2026-08-21"
summary = "plugin.toml, GameContext, live / CLI / replay."
added = [
  "plugin.toml (key, version, platform_version, extras)",
  "Host only loads games written for this major",
  "request_input, update, DMs, record_event, respond_query",
  "TurnBasedGame: reset, apply_move, render",
  "Same game class on Discord, CLI, and replay",
  "Missing parse_replay, bot_move, or remove_player skips the game",
]
changed = [
  "Games import strife.engine and strife.presentation only",
  "Live clicks and replay rows are the same Move type",
  "Peek is query=True, not a move",
  "Group votes: collect silently, then one record_event",
]
removed = [
  "Lobby-assigned roles",
]

[[release]]
version = "0.3.0"
date = "2026-08-15"
summary = "Layouts are dataclasses. Shared helpers."
added = [
  "LayoutView, Container, Button, Select — the host compiles them",
  "game_container, add_controls, query_panel",
  "run_cpu so heavy bots don't freeze the bot",
]
changed = [
  "Emoji on buttons is a name, not a Discord emoji object",
  "Replay hides action rows",
]

[[release]]
version = "0.2.0"
date = "2026-07-14"
summary = "Slash moves, peek, timeouts around play()."
added = [
  "slash_moves (same Move as a button)",
  "handle_query for peek",
  "Timeouts on bot_move, handle_query, final_view, parse_replay",
  "forfeit, game_end, bot_takeover, timeout — host-only log events",
]
changed = [
  "Games don't import discord or build custom_ids",
]
fixed = [
  "Bot takeover banners attach to the next replay frame",
]

[[release]]
version = "0.1.0"
date = "2026-06-22"
summary = "play(), bots, settings, replay log."
added = [
  "Game + metadata (player count, settings, bots)",
  "play() returns GameOutcome; parse_replay for finished matches",
  "bot_move and lobby settings",
  "Seeded rng so rematch can reshuffle the same way",
]
