  "Docker image that syncs builtin plugin extras at build",
  "Forum channels rejected; lobbies need a guild text channel",
]
changed = [
  "Catalog, about, settings, profile, and errors share one layout language",
  "Launch games wired for public play (test game stays disabled)",
]
fixed = [
  "Spyfall bots during discussion",
  "Persist-on-shutdown leaving occupancy stuck",
]

