# Bot history. Shown in /strife about → Changes.
# Newest first. Game API versions go in platform.toml.

[[release]]
version = "1.2.0"
date = "2026-10-04"
summary = "Live matches pause and resume; lobby, match, and replay fixes."
changed = [
  "Live matches pause on shutdown and resume after a restart",
  "Plugin installs and updates roll back on failure; an update is refused while that game is live",
]
fixed = [
  "A lobby no longer auto-starts when someone leaves or is kicked",
  "Deny on a stale join-request card explains itself",
  "Rematch keeps the blacklist and approvals, and skips people who left the server",
  "Bulk-deleted or channel-deleted lobbies release their players",
  "/play during a restart no longer fails",
  "Two first-to-act clicks at once no longer both count",
  "A bot that errors no longer ends the match",
  "Timeouts no longer race with a click that already landed",
  "Timeout strikes survive a restart",
  "A deleted board message is posted again",
  "Archived game threads reopen when the match resumes",
  "Replay buttons respond while a long rebuild is running",
  "A still-live match code says the game is still going",
  "Abandoned matches no longer read as a draw",
  "Profile page jump and last page work",
  "Forfeit results show on the profile",
]

[[release]]
version = "1.1.0"
date = "2026-10-04"
summary = "Replays rebuilt from the real game; old replays retired."
changed = [
  "Replays are rebuilt from the game itself, so they always match what happened",
  "Matches played before this update can no longer be replayed",
  "Profile action counts include every choice a player made",
]
fixed = [
  "A bot taking over for an AFK player can no longer make an illegal move",
]

[[release]]
version = "1.0.6"
date = "2026-10-04"
summary = "Private replays and profiles, clearer lobby errors, restart cleanup."
fixed = [
  "Replays open by match code only, and only in the server they were played in",
  "Profiles show this server's matches and stats, not every server's",
  "/strife server is limited to Administrators and checks the bot's channel permissions",
  "/play explains missing bot permissions instead of failing with a generic error",
  "Approving a join request for someone busy elsewhere says so instead of a wrong error",
  "Rematch tells you who is busy and keeps the button usable",
  "60-second games send a turn warning again",
  "Timeouts in first-to-act phases no longer blame whoever is seated first",
  "Results show a loss when a bot finished your AFK seat",
  "Forfeits mid-match show up in replays",
  "Game slash options show their help text and fixed choices",
]
added = [
  "Leave withdraws a pending join request",
  "Changing rules or bots resets ready so nobody launches under a surprise ruleset",
  "Restarts close open lobbies and rematch offers, and crashed games get an interrupted notice",
]
changed = [
  "Slash commands only work in servers",
]

