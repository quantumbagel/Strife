# Bot product history (strife.__version__). Shown in /strife about → Changes.
# Newest first. Do not bump PLATFORM_VERSION here — that lives in platform.toml.

[[release]]
version = "1.0.1"
date = "2026-09-10"
summary = "Chess variants, a lobby select fix, and shorter docs."
added = [
  "Chess 1.1.0: variants, numbered clocks, and creator color",
]
changed = [
  "Shorter README and game-author docs",
]
fixed = [
  "Remove-bot dropdown showed raw bot_indicator markup",
]

[[release]]
version = "1.0.0"
date = "2026-09-07"
summary = "Plugins install from git, and Changes shows what shipped."
added = [
  "strife/install, update, and uninstall for git plugin repos and builtins",
  "Plugin emoji uploaded as {key}_{stem} from each package's emoji/ folder",
  "/strife about → Changes for bot, game API, and per-game notes",
  "GitHub game-plugin template (templates/game-plugin/) as the third-party authoring path",
  "Privacy notes for a public instance (docs/privacy.md)",
]
changed = [
  "Game extras live in plugin.toml, not the host pyproject.toml",
  "Catalog cards show the latest changelog date next to the game version",
]
fixed = [
  "Privacy and occupancy bugs on rematch, forfeit, and lobby start",
]

[[release]]
version = "0.6.0"
date = "2026-08-21"
summary = "Shipped platform 1.0.0 and split the live host from the plugin API."
added = [
  "Plugin-facing engine (Game, GameContext, metadata) separate from strife.session",
  "Auto-sharded gateway, sized Postgres pool, and a dedicated CPU worker pool",
]
changed = [
  "Games assign roles in play(); the lobby Roles tab is gone",
  "Live Discord session is a host behind GameContext, not a class games import",
]
removed = [
  "Deprecated GameSession import path games were still reaching through",
]

[[release]]
version = "0.5.0"
