  "A bot taking over your AFK seat frees you to play again",
  "A bot's result on your AFK seat counts as your loss, not its win",
  "Matches with no active humans left end instead of bots finishing alone",
  "Players who quit or went AFK don't block a rematch or come back as bots",
  "Page jump in the catalog, profile, and replays updates the page",
  "Picking an autocomplete explanation shows it instead of a confusing error",
  "Setting a number rule after the lobby started or closed no longer rewrites it",
]
added = [
  "Simultaneous choices (votes, night actions) confirm privately and update the header",
]

